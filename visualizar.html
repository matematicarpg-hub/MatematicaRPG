<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Personagem - Matemática RPG</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0f2c 0%, #1a1f4c 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
      min-width: 300px;
    }

    .foto-grande {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #333, #111);
      border: 4px solid #f5c542;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 0 30px rgba(245, 197, 66, 0.5);
      flex-shrink: 0;
    }

    .foto-grande img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .info-basica h1 {
      font-size: 36px;
      color: #f5c542;
      text-shadow: 0 0 20px rgba(245, 197, 66, 0.5);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .classe-badge {
      display: inline-block;
      background: linear-gradient(135deg, #00cc66 0%, #00a850 100%);
      color: black;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 5px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f5c542 0%, #d4a017 100%);
      color: black;
      box-shadow: 0 5px 15px rgba(245, 197, 66, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 197, 66, 0.5);
    }

    .btn-secondary {
      background-color: #141932;
      color: #f5c542;
      border: 2px solid #f5c542;
    }

    .btn-secondary:hover {
      background-color: #f5c542;
      color: black;
      transform: translateY(-2px);
    }

    .descricao-card {
      background: rgba(20, 25, 50, 0.8);
      border: 2px solid #f5c542;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .descricao-label {
      color: #f5c542;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .descricao-texto {
      color: #e0e0e0;
      line-height: 1.6;
      font-size: 15px;
      font-style: italic;
      padding: 15px;
      background: rgba(20, 25, 50, 0.5);
      border-left: 4px solid #f5c542;
      border-radius: 8px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(20, 25, 50, 0.8);
      border: 2px solid #f5c542;
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .stat-title {
      color: #f5c542;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-row {
      margin-bottom: 15px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
      color: #f5c542;
    }

    .progress-bar {
      width: 100%;
      height: 25px;
      background: #0a0f2c;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00cc66, #00ff88);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: black;
    }

    .progress-fill.hp {
      background: linear-gradient(90deg, #ff6b6b, #ff3333);
    }

    .progress-fill.xp {
      background: linear-gradient(90deg, #ffd93d, #ffb300);
    }

    .progress-fill.energia {
      background: linear-gradient(90deg, #00d4ff, #00a8ff);
    }

    .inventario-container {
      background: rgba(20, 25, 50, 0.8);
      border: 2px solid #f5c542;
      border-radius: 15px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .inventario-title {
      color: #f5c542;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f5c542;
    }

    .itens-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
    }

    .item-slot {
      background: rgba(20, 25, 50, 0.5);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: default;
      transition: all 0.3s ease;
      font-size: 40px;
      line-height: 1.4;
    }

    .item-slot:hover {
      border-color: #f5c542;
      box-shadow: 0 5px 15px rgba(245, 197, 66, 0.2);
      transform: translateY(-3px);
    }

    .item-nome {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      font-weight: 600;
    }

    .empty-slot {
      background: rgba(100, 100, 100, 0.1);
      border-color: #444;
      color: #666;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      background: rgba(20, 25, 50, 0.6);
      border: 2px solid #333;
      color: #f5c542;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 13px;
    }

    .tab-btn:hover {
      border-color: #f5c542;
      background: rgba(245, 197, 66, 0.1);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #f5c542 0%, #d4a017 100%);
      color: black;
      border-color: #f5c542;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #f5c542;
      font-size: 18px;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid rgba(245, 197, 66, 0.3);
      border-radius: 50%;
      border-top-color: #f5c542;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
      }

      .title-section {
        width: 100%;
        justify-content: center;
      }

      .info-basica {
        text-align: center;
      }

      .button-group {
        justify-content: center;
      }

      .foto-grande {
        width: 120px;
        height: 120px;
        font-size: 60px;
      }

      .info-basica h1 {
        font-size: 28px;
      }

      .stats-container {
        grid-template-columns: 1fr;
      }

      .itens-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>⏳ Carregando personagem...</p>
    </div>

    <div id="conteudo" style="display: none;">
      <!-- Header com Foto e Info Básica -->
      <div class="header">
        <div class="title-section">
          <div class="foto-grande" id="fotoPersonagem">👤</div>
          <div class="info-basica">
            <h1 id="nomePersonagem">-</h1>
            <div class="classe-badge" id="classePersonagem">-</div>
          </div>
        </div>
        <div class="button-group">
          <button class="btn-secondary" onclick="irParaRanks()">🏆 Ver Ranks</button>
          <button class="btn-secondary" onclick="voltarHome()">← Voltar</button>
        </div>
      </div>

      <!-- Descrição -->
      <div class="descricao-card">
        <div class="descricao-label">📖 Descrição</div>
        <div class="descricao-texto" id="descricaoPersonagem">
          Nenhuma descrição disponível
        </div>
      </div>

      <!-- Stats com Barras -->
      <div class="stats-container">
        <!-- Card HP -->
        <div class="stat-card">
          <div class="stat-title">❤️ Vida (HP)</div>
          <div class="stat-row">
            <div class="stat-label">
              <span>HP</span>
              <span class="stat-value" id="hpText">100/100</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill hp" id="hpBar" style="width: 100%"></div>
            </div>
          </div>
        </div>

        <!-- Card XP -->
        <div class="stat-card">
          <div class="stat-title">⭐ Experiência (XP)</div>
          <div class="stat-row">
            <div class="stat-label">
              <span>Nível: <span class="stat-value" id="nivelText">1</span></span>
              <span class="stat-value" id="xpText">0/100</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill xp" id="xpBar" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Card Energia -->
        <div class="stat-card">
          <div class="stat-title">⚡ Energia</div>
          <div class="stat-row">
            <div class="stat-label">
              <span>Energia</span>
              <span class="stat-value" id="energiaText">0/50</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill energia" id="energiaBar" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Inventário -->
      <div class="inventario-container">
        <div class="inventario-title">🎒 Inventário</div>
        <div class="itens-grid" id="inventarioGrid">
          <!-- Itens serão adicionados aqui -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Emojis para itens
    const emojiItens = {
      'Espada': '🗡️',
      'Escudo': '🛡️',
      'Poção': '🧪',
      'Arco': '🏹',
      'Magia': '🔥',
      'Cristal': '💎'
    };

    // Emojis para classes
    const emojiClasses = {
      'Guerreiro': '⚔️',
      'Mago': '🔮',
      'Arqueiro': '🏹',
      'Clérigo': '✨'
    };

    function carregarPersonagem() {
      // Busca dados no localStorage
      const nome = localStorage.getItem("personagem_nome");
      const classe = localStorage.getItem("personagem_classe");
      const descricao = localStorage.getItem("personagem_desc");
      const foto = localStorage.getItem("personagem_foto");
      const itens = JSON.parse(localStorage.getItem("personagem_itens")) || [];
      
      const hp = parseInt(localStorage.getItem("personagem_hp")) || 100;
      const hpMax = parseInt(localStorage.getItem("personagem_hp_max")) || 100;
      const xp = parseInt(localStorage.getItem("personagem_xp")) || 0;
      const xpMax = parseInt(localStorage.getItem("personagem_xp_max")) || 100;
      const nivel = parseInt(localStorage.getItem("personagem_nivel")) || 1;
      const energia = parseInt(localStorage.getItem("personagem_energia")) || 0;
      const energiaMax = parseInt(localStorage.getItem("personagem_energia_max")) || 50;

      // Verifica se personagem existe
      if (!nome) {
        document.getElementById('loading').innerHTML = '<p style="color: #ff6b6b;">❌ Nenhum personagem encontrado!</p>';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      // Carrega foto
      const fotoEl = document.getElementById('fotoPersonagem');
      if (foto) {
        fotoEl.innerHTML = `<img src="${foto}" alt="${nome}">`;
      }

      // Carrega informações básicas
      document.getElementById('nomePersonagem').textContent = nome;
      document.getElementById('classePersonagem').textContent = `${emojiClasses[classe] || '⚔️'} ${classe}`;
      document.getElementById('descricaoPersonagem').textContent = descricao || 'Nenhuma descrição disponível';

      // Carrega HP
      document.getElementById('hpText').textContent = `${hp}/${hpMax}`;
      const hpPercent = (hp / hpMax) * 100;
      document.getElementById('hpBar').style.width = hpPercent + '%';
      document.getElementById('hpBar').textContent = hpPercent.toFixed(0) + '%';

      // Carrega XP
      document.getElementById('nivelText').textContent = nivel;
      document.getElementById('xpText').textContent = `${xp}/${xpMax}`;
      const xpPercent = (xp / xpMax) * 100;
      document.getElementById('xpBar').style.width = xpPercent + '%';
      document.getElementById('xpBar').textContent = xpPercent.toFixed(0) + '%';

      // Carrega Energia
      document.getElementById('energiaText').textContent = `${energia}/${energiaMax}`;
      const energiaPercent = (energia / energiaMax) * 100;
      document.getElementById('energiaBar').style.width = energiaPercent + '%';
      document.getElementById('energiaBar').textContent = energiaPercent.toFixed(0) + '%';

      // Carrega Inventário
      const inventarioGrid = document.getElementById('inventarioGrid');
      inventarioGrid.innerHTML = '';

      // Adiciona itens selecionados
      itens.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'item-slot';
        itemEl.innerHTML = `
          <div>${emojiItens[item] || '❓'}</div>
          <div class="item-nome">${item}</div>
        `;
        inventarioGrid.appendChild(itemEl);
      });

      // Se tiver menos de 4 itens, preenche com slots vazios
      while (itens.length < 4) {
        const emptySlot = document.createElement('div');
        emptySlot.className = 'item-slot empty-slot';
        emptySlot.innerHTML = `
          <div>-</div>
          <div class="item-nome">Vazio</div>
        `;
        inventarioGrid.appendChild(emptySlot);
        itens.push(null);
      }

      // Esconde loading e mostra conteúdo
      document.getElementById('loading').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
    }

    function irParaRanks() {
      window.location.href = 'ranks.html';
    }

    function voltarHome() {
      window.location.href = 'index.html';
    }

    // Carrega personagem ao abrir a página
    window.addEventListener('load', carregarPersonagem);
  </script>

</body>
</html>
